name: HRC-CEMS
channels:
  - conda-forge
  - pytorch
  - defaults

dependencies:
  # Core (mantener versiones existentes)
  - python=3.9
  - numpy=1.21.6
  - scipy=1.7.3
  - scikit-learn=1.1.3
  - pandas=2.0.3
  - seaborn=0.12.2
  - openpyxl=3.1.2
  
  # Google Sheets (existentes)
  - google-auth=2.17.3
  - google-auth-oauthlib=1.0.0
  - google-auth-httplib2=0.1.0
  
  # Web scraping (existentes)
  - beautifulsoup4=4.12.2
  - requests=2.31.0
  
  # Web app (existente)
  - flask=2.3.3
  
  # NLP/ML (existentes)
  - transformers=4.30.2
  - pytorch
  
  # Visualización (existente + wordcloud)
  - matplotlib=3.7.2
  - wordcloud=1.9.2
  
  # Utils (existentes + extras clustering)
  - python-dotenv=1.0.0
  - joblib=1.2.0
  
  # Desarrollo
  - jupyter
  - spyder-kernels=2.4.*
  - ipykernel
  
  # Clustering específico (NUEVO)
  - pip:
      - gspread==5.10.0
      - kaleido==0.2.1      # Plotly export